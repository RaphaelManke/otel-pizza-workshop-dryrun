# Pizza Order Tracker - workshop stack
#
# Compose reads variable values (DASH0_AUTH_TOKEN, DASH0_OTLP_ENDPOINT,
# SLOW_KITCHEN, NO_DRIVERS, ...) from the `.env` file that sits NEXT TO THIS
# FILE, i.e. `pizza-app/.env`. Create it from inside pizza-app/:
#
#     cp .env.template .env
#
# An `.env` anywhere else (the repo root, for example) is NOT read.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - DASH0_OTLP_ENDPOINT=${DASH0_OTLP_ENDPOINT}
      - DASH0_AUTH_TOKEN=${DASH0_AUTH_TOKEN}
    ports:
      - "4317:4317"
      - "4318:4318"

  order-service:
    build: ./order-service
    ports:
      - "3000:3000"
    environment:
      - KITCHEN_SERVICE_URL=http://kitchen-service:3001
      - DELIVERY_SERVICE_URL=http://delivery-service:3002
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      kitchen-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  kitchen-service:
    build: ./kitchen-service
    ports:
      - "3001:3001"
    environment:
      - SLOW_KITCHEN=${SLOW_KITCHEN:-false}
      - OTEL_SERVICE_NAME=kitchen-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  delivery-service:
    build: ./delivery-service
    ports:
      - "3002:3002"
    environment:
      - NO_DRIVERS=${NO_DRIVERS:-false}
      - OTEL_SERVICE_NAME=delivery-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      order-service:
        condition: service_healthy
